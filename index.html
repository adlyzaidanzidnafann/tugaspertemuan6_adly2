
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luas dan Keliling Persegi Panjang</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef4ff;
            padding: 20px;
        }

        .container {
            max-width: 420px;
            margin: 40px auto;
            padding: 25px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px #0002;
        }

        h2 {
            text-align: center;
            color: #2459a9;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #2459a9;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        #hasil {
            margin-top: 20px;
            padding: 15px;
            background: #eef7ff;
            border-radius: 8px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Kalkulator Persegi Panjang</h2>

        <label for="panjang">Panjang</label>
        <input type="number" id="panjang"
               placeholder="Masukkan panjang" min="0" step="any">

        <label for="lebar">Lebar</label>
        <input type="number" id="lebar"
               placeholder="Masukkan lebar" min="0" step="any">

        <button onclick="hitung()">Hitung</button>

        <div id="hasil">
            Hasil luas dan keliling akan muncul di sini.
        </div>
    </div>

    <script>
        function hitung() {
            let p = document.getElementById("panjang").value;
            let l = document.getElementById("lebar").value;
            let hasil = document.getElementById("hasil");

            if (p === "" || l === "" || Number(p) < 0 || Number(l) < 0) {
                hasil.innerHTML =
                    "Masukkan panjang dan lebar yang valid.";
                return;
            }

            p = Number(p);
            l = Number(l);

            let luas = p * l;
            let keliling = 2 * (p + l);

            hasil.innerHTML = `
                <strong>Hasil Perhitungan</strong><br>
                Panjang: ${p}<br>
                Lebar: ${l}<br>
                Luas: ${luas}<br>
                Keliling: ${keliling}
            `;
        }
    </script>

</body>
</html>
